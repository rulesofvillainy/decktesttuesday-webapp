services:
  - type: web
    name: deck-test-tuesday
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx --no-install next start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false
